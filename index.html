<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UpBudget</title>
<style>
  :root { --bg:#fff; --fg:#1c1c28; --muted:#6b6b80; --line:#e6e6ee; --pos:#0a8f4e; --neg:#c0392b; --accent:#ff7a64; }
  @media (prefers-color-scheme: dark) { :root { --bg:#16161d; --fg:#ececf2; --muted:#9a9ab0; --line:#2c2c3a; --pos:#4cd38b; --neg:#ff7b6b; } }
  body { margin:0; font:15px/1.4 system-ui,sans-serif; background:var(--bg); color:var(--fg); }
  main { max-width:900px; margin:0 auto; padding:16px; }
  h1 { margin:0 0 12px; color:var(--accent); }
  .controls { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
  input, select, button { font:inherit; padding:6px 8px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg); }
  input[type=search] { flex:1; min-width:140px; }
  button { background:var(--accent); color:#fff; border:0; cursor:pointer; }
  .summary { display:flex; gap:24px; margin-bottom:12px; flex-wrap:wrap; }
  .summary div span { display:block; color:var(--muted); font-size:12px; }
  .summary b { font-size:20px; }
  table { width:100%; border-collapse:collapse; }
  td { padding:8px 4px; border-bottom:1px solid var(--line); vertical-align:top; }
  .amt { text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .pos { color:var(--pos); } .neg { color:var(--neg); }
  .sub { color:var(--muted); font-size:12px; }
  #status { color:var(--muted); margin:8px 0; }
  details { margin-bottom:12px; } summary { cursor:pointer; color:var(--muted); margin-bottom:8px; } a { color:var(--accent); }
  :root { --src:#8a8aa0; --acct:#ff7a64; --xfer:#3b82f6; }
  @media (prefers-color-scheme: dark) { :root { --src:#7a7a92; --xfer:#6aa5ff; } }
  h2 { font-size:16px; margin:20px 0 4px; }
  #flow { width:100%; height:auto; display:block; }
  #flow text { fill:var(--fg); font-size:12px; }
  #flow .muted { fill:var(--muted); font-size:11px; }
  #flow .halo { stroke:var(--bg); stroke-width:4px; paint-order:stroke; }
  .legend { display:flex; gap:16px; flex-wrap:wrap; font-size:12px; color:var(--muted); margin-bottom:8px; }
  .legend i { display:inline-block; width:14px; height:4px; border-radius:2px; margin-right:6px; vertical-align:middle; }
  .error { color:var(--neg); }
</style>
</head>
<body>
<main>
  <h1>UpBudget</h1>
  <details id="settings">
    <summary>Settings</summary>
    <div class="controls">
      <input id="token" type="password" placeholder="Up personal access token (up:yeah:…)" autocomplete="off" style="flex:2">
      <input id="base" type="url" placeholder="API base URL (default https://api.up.com.au/api/v1)">
    </div>
    <div class="sub">Stored only in this browser's localStorage. Get a token at <a href="https://api.up.com.au/getting_started">api.up.com.au</a>. If requests fail with a network/CORS error, set the base URL to your proxy (see README).</div>
  </details>
  <div class="controls">
    <input id="since" type="date" aria-label="From">
    <input id="until" type="date" aria-label="To">
    <select id="account" aria-label="Account"><option value="">All accounts</option></select>
    <input id="q" type="search" placeholder="Search…">
    <button id="load">Load</button>
  </div>
  <div class="summary">
    <div><span>Money in</span><b id="in" class="pos">–</b></div>
    <div><span>Money out</span><b id="out" class="neg">–</b></div>
    <div><span>Net</span><b id="net">–</b></div>
  </div>
  <div id="status"></div>
  <h2>Money flow</h2>
  <div class="legend">
    <span><i style="background:var(--src)"></i>External income</span>
    <span><i style="background:var(--xfer)"></i>Transfers between accounts (net)</span>
  </div>
  <svg id="flow" role="img" aria-label="Money flow between external sources and accounts"></svg>
  <h2>Transactions</h2>
  <table><tbody id="rows"></tbody></table>
</main>
<script>
const $ = id => document.getElementById(id);
const money = n => (n < 0 ? '-' : '') + '$' + Math.abs(n).toLocaleString('en-AU', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
let all = [];
const MAX_PAGES = 5;

// Default range: last 30 days
const d = new Date(); $('until').value = d.toISOString().slice(0, 10);
d.setDate(d.getDate() - 30); $('since').value = d.toISOString().slice(0, 10);

const DEFAULT_BASE = 'https://api.up.com.au/api/v1';
const store = {
  get: k => { try { return localStorage.getItem(k) || ''; } catch { return ''; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
};
$('token').value = store.get('up_token');
$('base').value = store.get('up_base');
if (!$('token').value) $('settings').open = true;

async function upGet(url, token) {
  const res = await fetch(url, { headers: { Authorization: `Bearer ${token}` } });
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    throw new Error(body.errors?.[0]?.detail || `${res.status} ${res.statusText}`);
  }
  return res.json();
}

async function load() {
  const token = $('token').value.trim();
  const base = ($('base').value.trim() || DEFAULT_BASE).replace(/\/+$/, '');
  store.set('up_token', token); store.set('up_base', $('base').value.trim());
  $('status').className = '';
  if (!token) { $('status').className = 'error'; $('status').textContent = 'Enter your Up token in Settings.'; return; }
  $('status').textContent = 'Loading…';

  const q = new URLSearchParams({ 'page[size]': '100' });
  if ($('since').value) q.set('filter[since]', new Date($('since').value + 'T00:00:00').toISOString());
  if ($('until').value) q.set('filter[until]', new Date($('until').value + 'T23:59:59').toISOString());
  try {
    const [accounts, txns] = await Promise.all([
      upGet(`${base}/accounts`, token),
      (async () => {
        const out = []; let url = `${base}/transactions?${q}`;
        for (let i = 0; i < MAX_PAGES && url; i++) {
          const page = await upGet(url, token);
          out.push(...page.data); url = page.links?.next;
        }
        return { data: out, more: Boolean(url) };
      })(),
    ]);
    const names = Object.fromEntries(accounts.data.map(a => [a.id, a.attributes.displayName]));
    all = txns.data.map(t => ({
      description: t.attributes.description, message: t.attributes.message, status: t.attributes.status,
      createdAt: t.attributes.createdAt, amount: Number(t.attributes.amount.valueInBaseUnits) / 100,
      account: names[t.relationships.account.data.id] || 'Unknown',
      transferTo: names[t.relationships.transferAccount?.data?.id] || null,
      isTransfer: Boolean(t.relationships.transferAccount?.data),
      category: t.relationships.category.data?.id || null,
    }));
    const accts = [...new Set(all.map(t => t.account))].sort();
    const cur = $('account').value;
    $('account').innerHTML = '<option value="">All accounts</option>' + accts.map(a => `<option>${esc(a)}</option>`).join('');
    $('account').value = accts.includes(cur) ? cur : '';
    $('status').textContent = txns.more ? 'Showing the first 500 transactions; narrow the date range for more.' : '';
    render(); renderFlow();
  } catch (e) {
    $('status').className = 'error';
    $('status').textContent = e instanceof TypeError
      ? 'Network/CORS error: the browser could not reach the API. Set an API base URL pointing at a CORS proxy (see README).'
      : e.message;
  }
}

function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }

function renderFlow() {
  const svg = $('flow');
  // Incoming money from outside (not a transfer between own accounts), grouped by description
  const srcMap = {}, accIn = {}, accounts = new Set(), pair = {};
  for (const t of all) {
    accounts.add(t.account);
    if (t.isTransfer) {
      if (t.amount < 0 && t.transferTo) {            // count each transfer once, from the sending side
        accounts.add(t.transferTo);
        const [a, b] = [t.account, t.transferTo].sort(), k = a + '\u0000' + b;
        pair[k] = (pair[k] || 0) + (t.account === a ? -t.amount : t.amount); // + means a → b
      }
    } else if (t.amount > 0) {
      (srcMap[t.description] ||= {})[t.account] = ((srcMap[t.description] || {})[t.account] || 0) + t.amount;
      accIn[t.account] = (accIn[t.account] || 0) + t.amount;
    }
  }
  // Keep the top sources; bundle the rest
  const totals = Object.entries(srcMap).map(([n, m]) => [n, Object.values(m).reduce((a, b) => a + b, 0), m]).sort((x, y) => y[1] - x[1]);
  const TOP = 8, sources = totals.slice(0, TOP).map(([name, total, m]) => ({ name, total, m }));
  if (totals.length > TOP) {
    const m = {}; let total = 0;
    for (const [, tt, mm] of totals.slice(TOP)) { total += tt; for (const a in mm) m[a] = (m[a] || 0) + mm[a]; }
    sources.push({ name: `Other (${totals.length - TOP})`, total, m });
  }
  const accts = [...accounts].sort((a, b) => (accIn[b] || 0) - (accIn[a] || 0));
  const links = Object.entries(pair).filter(([, v]) => Math.abs(v) >= 0.005).map(([k, v]) => {
    const [a, b] = k.split('\u0000'); return v > 0 ? { from: a, to: b, v } : { from: b, to: a, v: -v };
  });
  if (!sources.length && !links.length) { svg.setAttribute('viewBox', '0 0 900 60'); svg.innerHTML = '<text x="450" y="35" text-anchor="middle" class="muted">No incoming or transfer activity in this range.</text>'; return; }

  const ROW = 64, PAD = 24, H = Math.max(sources.length, accts.length) * ROW + PAD * 2;
  const sy = i => PAD + (i + 0.5) * (H - PAD * 2) / sources.length;
  const ay = i => PAD + (i + 0.5) * (H - PAD * 2) / accts.length;
  const SX = 230, AX = 380, AW = 170, AH = 40;
  const max = Math.max(...sources.flatMap(x => Object.values(x.m)), ...links.map(l => l.v), 1);
  const w = v => 1.5 + 14 * Math.sqrt(v / max);
  const idx = Object.fromEntries(accts.map((a, i) => [a, i]));
  const short = (t, n) => t.length > n ? t.slice(0, n - 1) + '…' : t;
  let out = `<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--xfer)"/></marker></defs>`;
  let width = 900;
  // External → account
  sources.forEach((src, i) => {
    for (const [a, v] of Object.entries(src.m)) {
      const x1 = SX, y1 = sy(i), x2 = AX, y2 = ay(idx[a]);
      out += `<path d="M${x1} ${y1}C${(x1+x2)/2} ${y1} ${(x1+x2)/2} ${y2} ${x2} ${y2}" fill="none" stroke="var(--src)" stroke-opacity=".45" stroke-width="${w(v)}"><title>${esc(src.name)} → ${esc(a)}: ${money(v)}</title></path>`;
    }
  });
  // Account → account (net), bulging out to the right
  links.sort((p, q) => Math.abs(idx[p.from] - idx[p.to]) - Math.abs(idx[q.from] - idx[q.to]));
  for (const l of links) {
    const x = AX + AW, y1 = ay(idx[l.from]), y2 = ay(idx[l.to]), dy = Math.abs(y2 - y1);
    const bx = x + 40 + dy * 0.35, off = y1 < y2 ? AH / 2 - 4 : -AH / 2 + 4;
    out += `<path d="M${x} ${y1 + off}C${bx} ${y1 + off} ${bx} ${y2 - off} ${x + 2} ${y2 - off}" fill="none" stroke="var(--xfer)" stroke-opacity=".6" stroke-width="${w(l.v)}" marker-end="url(#arr)"><title>${esc(l.from)} → ${esc(l.to)}: ${money(l.v)}</title></path>`;
    const lx = x + 0.75 * (bx - x) + 4, ly = (y1 + y2) / 2;
    out += `<text class="halo" x="${lx}" y="${ly}" dominant-baseline="middle">${money(l.v)}</text><text x="${lx}" y="${ly}" dominant-baseline="middle">${money(l.v)}</text>`;
    width = Math.max(width, lx + 70);
  }
  // Nodes
  sources.forEach((src, i) => {
    out += `<text x="${SX - 8}" y="${sy(i) - 6}" text-anchor="end"><title>${esc(src.name)}</title>${esc(short(src.name, 28))}</text>
      <text class="muted" x="${SX - 8}" y="${sy(i) + 8}" text-anchor="end">${money(src.total)}</text>
      <circle cx="${SX}" cy="${sy(i)}" r="4" fill="var(--src)"/>`;
  });
  accts.forEach((a, i) => {
    out += `<rect x="${AX}" y="${ay(i) - AH / 2}" width="${AW}" height="${AH}" rx="8" fill="var(--acct)"/>
      <text x="${AX + AW / 2}" y="${ay(i) - 4}" text-anchor="middle" style="fill:#fff;font-weight:600">${esc(short(a, 22))}</text>
      <text x="${AX + AW / 2}" y="${ay(i) + 11}" text-anchor="middle" style="fill:#fff;font-size:11px">in: ${money(accIn[a] || 0)}</text>`;
  });
  svg.setAttribute('viewBox', `0 0 ${width} ${H}`);
  svg.innerHTML = out;
}

function render() {
  const q = $('q').value.toLowerCase(), acct = $('account').value;
  const list = all.filter(t => (!acct || t.account === acct) &&
    (!q || `${t.description} ${t.message || ''} ${t.category || ''}`.toLowerCase().includes(q)));
  // Transfers between your own accounts net to zero; exclude from totals.
  const real = list.filter(t => !t.isTransfer);
  const inn = real.filter(t => t.amount > 0).reduce((s, t) => s + t.amount, 0);
  const out = real.filter(t => t.amount < 0).reduce((s, t) => s + t.amount, 0);
  $('in').textContent = money(inn); $('out').textContent = money(out);
  $('net').textContent = money(inn + out); $('net').className = inn + out >= 0 ? 'pos' : 'neg';
  $('rows').innerHTML = list.map(t => `<tr>
    <td>${esc(t.description)}${t.status === 'HELD' ? ' <span class="sub">(pending)</span>' : ''}
      <div class="sub">${new Date(t.createdAt).toLocaleDateString('en-AU')} · ${esc(t.account)}${t.category ? ' · ' + esc(t.category) : ''}${t.message ? ' · ' + esc(t.message) : ''}</div></td>
    <td class="amt ${t.amount >= 0 ? 'pos' : 'neg'}">${money(t.amount)}</td></tr>`).join('');
}

$('load').onclick = load;
$('q').oninput = $('account').onchange = render;
if ($('token').value) load();
</script>
</body>
</html>
